# Normalizes X-Forwarded-Prefix (set by the external reverse proxy, e.g.
# "X-Forwarded-Prefix: /sparql-conformance-ui-v2") into a value with a leading
# slash and no trailing slash, or "" for root/no header. Only one proxy hop in
# a chain should set this header.
map $http_x_forwarded_prefix $base_path {
  default                 "";
  "~^/?$"                 "";
  "~^/?(?<p>.+?)/?$"      "/$p";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  set $base_href "${base_path}/";

  location ~ ^/(?:.+/)?api/ {
    rewrite ^/(?:.+/)?api/(.*)$ /api/$1 break;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    # index.html carries the base path baked in below, so the same build can
    # represent a different prefix on every request depending on which proxy
    # served it - never let it be cached across prefix changes.
    add_header Cache-Control "no-store" always;
    gzip off;
    sub_filter '__BASE_PATH__/' $base_href;
    sub_filter_once on;
    try_files $uri /index.html;
  }
}
