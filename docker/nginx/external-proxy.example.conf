# Example configuration for YOUR OWN outer reverse proxy (NOT the app's bundled
# nginx in docker/nginx/default.conf). Use this when hosting the site under a
# subpath, e.g.:
#
#   https://example.com/example/        -> frontend
#   https://example.com/example/api/... -> public read API
#   https://example.com/upload/...      -> uploader
#
# Two things are required for subpath hosting, and BOTH matter:
#   1. Strip the prefix before forwarding (the trailing slash on proxy_pass).
#      The app serves everything from its own root and resolves static assets
#      with try_files, so it cannot handle a prefixed path like /example/assets/*.
#   2. Send X-Forwarded-Prefix so the app knows which prefix to bake into
#      <base href>, making links/assets point back under the subpath.
# The header alone is not enough: it only controls generated URLs, it does not
# route requests. Only the outermost proxy in a chain should set the header.

server {
    listen 443 ssl;
    server_name example.com;

    # --- Frontend + read API (served by the app's `web` container on :8080) ---
    # The app's nginx proxies /api/* internally, so this one location covers
    # both the site and the public read API.
    location = /example { return 301 /example/; }
    location /example/ {
        # Trailing slash => strip the /example/ prefix, so the app receives
        # /assets/... and /api/... at its own root.
        proxy_pass http://127.0.0.1:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Prefix /example;
    }

    # --- Uploader (separate `uploader` service on :3001) ---
    # Unlike the frontend, the uploader is a pure JSON API (only POST /api/upload)
    # and serves no HTML/assets, so it needs NO X-Forwarded-Prefix header. It only
    # needs the /upload/ prefix stripped so its own route (/api/upload) matches:
    # the trailing slash on proxy_pass does that. Without stripping, the app would
    # receive /upload/api/upload and 404.
    # If instead you give the uploader its own host or root (e.g. upload.example.com),
    # you need neither the prefix strip nor a header — drop this whole block.
    location = /upload { return 301 /upload/; }
    location /upload/ {
        proxy_pass http://127.0.0.1:3001/;   # trailing slash strips /upload/

        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }
}
