services:
  web-private:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${PRIVATE_WEB_PORT:-8081}:80"
    depends_on:
      - api-private

  api-private:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_MODE: private
      API_SURFACE: all
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      DB_PATH: /tmp/conformance.db
      LOCAL_RESULTS_DIR: /results
      PRIVATE_AUTO_IMPORT: "true"
    volumes:
      - ${LOCAL_RESULTS_DIR:-./public/results}:/results:ro
    networks:
      default:
        aliases:
          - api
